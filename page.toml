summary = "A small overlay that tells you what you are looking at: the block, fluid or creature, its mod and its tool."
description = """
A small overlay at the top of the screen that tells you what you are looking at.

A port of [Jade](https://github.com/Snownee/Jade) by Snownee to [Sunrise](https://playsunrise.net) (Minecraft Java 26.3), under the original's licence (CC BY-NC-SA 4.0, in `LICENSE`; see `NOTICE`): free to use and share, not for commercial use, and changes stay under the same licence. One native mod on Sunrise's mod API; the code is a rewrite of Jade's logic, and Jade's own language files, sprites and themes are included.

What it does:

- Names the block, fluid or entity under your crosshair, with its icon, its mod, the tool that harvests it and the breaking progress.
- Shows what is inside containers, machines' energy, and lines other mods add through Jade's provider API.
- Lite mode, longer reach, ignore lists, scale, position, opacity and fade, as in Jade.
- Jade's seven themes, and themes from resource packs.
- The config screens, with search and four profiles; the keys are under Controls, category Jade.
- `/jadec` client commands, `/jade show|hide` for operators, and the `jade:max_position_deviation` game rule.
- In multiplayer the server answers only for blocks and entities in your reach, and shows a locked container as locked.

Differences from the original, each waiting on a piece of Sunrise's mod API:

- The jump and speed factor lines are missing (sunrise-org/sunrise#5307, fixed for the next Sunrise build), and so are the fire odds lines (sunrise-org/sunrise#5492).
- The `POI:` line is missing (sunrise-org/sunrise#5493).
- Mods that don't name themselves to Jade show a name made from their id (sunrise-org/sunrise#5494).
- On a server without Jade, entities show no overlay; with Jade on the server every line shows (sunrise-org/sunrise#4741, #5321, #5498). A sitting panda shows no sitting state (sunrise-org/sunrise#5499).
- Dropped items don't show their own tooltip lines (sunrise-org/sunrise#5332).
- A mod block or entity that picks a different item than its plain one shows its plain item as the icon (sunrise-org/sunrise#5289, #5495).
- Options › Mods' Config button doesn't open Jade's screens; use the Open Config key or `/jadec config` (sunrise-org/sunrise#1217).
- "Edit ignore list in Files…" prints the paths in chat (sunrise-org/sunrise#5336).
- Narrate is silent while the Narrator option is "Chat only" (sunrise-org/sunrise#5496).

Not done yet in the port: the full provider API for other mods, the interactive pin screen, Save & Quit and Cancel in the config screens, and REI and Polydex compatibility (recipe lookup works through JEI). The README lists them all.
"""
authors = ["Sunrise port: Joeypc6", "Snownee", "arismoko"]
homepage = "https://github.com/arismoko/Jade-Sunrise"
issues = "https://github.com/arismoko/Jade-Sunrise/issues"
categories = ["utility"]

